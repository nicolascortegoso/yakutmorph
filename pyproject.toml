[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yakutmorph"
version = "0.2.0"
authors = [
  { name="Nicolas Cortegoso Vissio", email="nicolascortegoso@hotmail.com" },
]
description = "A morphological analyzer for the Yakut (Sakha) language"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["morphology", "morphological analysis", "disambiguation", "finite-state transducer", "Yakut", "Sakha", "NLP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "sfst-transduce>=1.3.1",
    "PyYAML>=6.0.1",
    "sentencepiece>=0.2.0",
    # onnxruntime 1.24.1-1.24.3 declare Python 3.10 support but ship no
    # 3.10 wheels; 1.23.2 is the last release with them.
    "onnxruntime>=1.19,<1.24; python_version < '3.11'",
    "onnxruntime>=1.19; python_version >= '3.11'",
    "numpy>=1.24",
]

[project.optional-dependencies]
# MCP server for LLM applications: `yakutmorph-mcp` (see yakutmorph/mcp_server.py).
mcp = ["mcp>=2.3,<3"]

[project.scripts]
yakutmorph = "yakutmorph.cli:main"
yakutmorph-mcp = "yakutmorph.mcp_server:main"

[project.urls]
Homepage = "https://github.com/nicolascortegoso/yakutmorph"
Repository = "https://github.com/nicolascortegoso/yakutmorph"
Issues = "https://github.com/nicolascortegoso/yakutmorph/issues"

[dependency-groups]
dev = [
    "yakutmorph[mcp]",
    "pytest>=8",
    "build>=1.2",
    "twine>=6",
]
# Only for retraining the disambiguation model (disambiguation_model/scripts).
train = [
    "torch>=2.4",
    "onnx>=1.16",
]

[tool.setuptools.packages.find]
include = ["yakutmorph", "yakutmorph.*"]

[tool.setuptools.package-data]
"yakutmorph.data" = ["*.yaml", "*.onnx", "*.model", "*.json", "*.txt", "*.gz"]
"yakutmorph.fsts" = ["*.a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
