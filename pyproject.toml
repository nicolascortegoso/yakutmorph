[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yakutmorph"
version = "0.0.5"
authors = [
  { name="Nicolas Cortegoso Vissio", email="nicolascortegoso@hotmail.com" },
]
description = "A morphological analyzer for the Yakut (Sakha) language"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
keywords = ["python", "morphology", "analyzer", "Yakut", "Sakha", "NLP"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sfst-transduce>=1.0.2",
    "PyYAML>=6.0.1",
    "sentencepiece>=0.2.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/nicolascortegoso/yakutmorph"

[tool.setuptools.packages.find]
include = ["yakutmorph", "yakutmorph.*"]

[tool.setuptools.package-data]
"yakutmorph.data" = ["*.yaml", "*.onnx", "*.model", "*.json"]
"yakutmorph.fsts" = ["*.a"]
